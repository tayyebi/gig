# TLS terminates here; the app is reached over the internal compose network
# and publishes no host port of its own.
upstream app {
	server web:4099;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name _;

	ssl_certificate     /etc/nginx/certs/server.crt;
	ssl_certificate_key /etc/nginx/certs/server.key;
	ssl_protocols       TLSv1.2 TLSv1.3;
	ssl_session_cache   shared:SSL:10m;
	ssl_session_timeout 1d;

	# A plain-HTTP request to the TLS port trips 497; bounce it to https so
	# visitors who forget the scheme get a redirect instead of a byte dump.
	error_page 497 =301 https://$http_host$request_uri;

	# Uploads go through this proxy; keep the limit generous enough not to be
	# the thing that rejects them before the app can.
	client_max_body_size 32m;

	location / {
		proxy_pass http://app;
		proxy_http_version 1.1;

		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-Host  $http_host;

		# Websocket/upgrade passthrough, harmless for plain requests.
		proxy_set_header Upgrade    $http_upgrade;
		proxy_set_header Connection $connection_upgrade;

		proxy_read_timeout 60s;
	}
}

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}
