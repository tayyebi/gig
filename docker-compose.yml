services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gig
      POSTGRES_PASSWORD: gig-dev-password
      POSTGRES_DB: gig
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gig -d gig"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Published only for local tooling (tests, psql); the app talks over the
    # internal network. Bind to loopback so it is never exposed externally.
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - internal

  web:
    build: .
    environment: &app_env
      APP_ROLE: web
      ENVIRONMENT: dev
      LOG_LEVEL: debug
      HTTP_ADDR: ":8080"
      BASE_URL: "http://localhost:8090"
      DATABASE_URL: "postgres://gig:gig-dev-password@db:5432/gig?sslmode=disable"
      SESSION_SECRET: "dev-only-session-secret-0123456789abcdef"
      CSRF_SECRET: "dev-only-csrf-secret-0123456789abcdef"
      STORAGE_DIR: "/app/data"
      JOB_CONCURRENCY: "4"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - appdata:/app/data
    networks:
      - internal

  worker:
    build: .
    environment:
      <<: *app_env
      APP_ROLE: worker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - appdata:/app/data
    networks:
      - internal

volumes:
  pgdata:
  appdata:

networks:
  # Internal bridge with no default external exposure.
  internal:
    driver: bridge
