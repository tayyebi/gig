services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gig
      POSTGRES_PASSWORD: gig-dev-password
      POSTGRES_DB: gig
    volumes:
      # Bind-mounted to the host so data persists outside Docker's storage.
      - ./.docker/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gig -d gig"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Not published to the host at all; reachable only over the internal
    # network as "db:5432". Use `docker compose exec db psql ...` for tooling.
    networks:
      - internal

  web:
    build: .
    environment: &app_env
      APP_ROLE: web
      ENVIRONMENT: dev
      LOG_LEVEL: debug
      HTTP_ADDR: ":4099"
      BASE_URL: "https://localhost:4100"
      DATABASE_URL: "postgres://gig:gig-dev-password@db:5432/gig?sslmode=disable"
      SESSION_SECRET: "dev-only-session-secret-0123456789abcdef"
      CSRF_SECRET: "dev-only-csrf-secret-0123456789abcdef"
      STORAGE_DIR: "/data"
      PRIVATE_STORAGE_DIR: "/data-private"
      JOB_CONCURRENCY: "4"
      GOCACHE: "/gocache"
      GOMODCACHE: "/gomodcache"
      BIN_PATH: "/hostbin/gig"
    depends_on:
      db:
        condition: service_healthy
    # No host port: the app is reachable only through the nginx proxy.
    volumes:
      # Source, tooling caches, compiled binary, and app data all live on
      # the host — the container contributes nothing but the Go runtime.
      - .:/app
      - ./.docker/gocache:/gocache
      - ./.docker/gomodcache:/gomodcache
      - ./.docker/bin:/hostbin
      - ./.docker/data:/data
      - ./.docker/data-private:/data-private
    networks:
      - internal

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    environment:
      # Names baked into the self-signed cert. Set this to the server's public
      # hostname or IP (comma-separated) before first start, or delete
      # .docker/certs to have it reissued.
      CERT_HOSTS: "${CERT_HOSTS:-localhost}"
    depends_on:
      - web
    # The only port published to the host. Everything else talks over the
    # internal network.
    ports:
      - "4100:443"
    volumes:
      # Certificate persists on the host so clients trust it just once.
      - ./.docker/certs:/etc/nginx/certs
    networks:
      - internal

  worker:
    build: .
    environment:
      <<: *app_env
      APP_ROLE: worker
      BIN_PATH: "/hostbin/gig-worker"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - ./.docker/gocache:/gocache
      - ./.docker/gomodcache:/gomodcache
      - ./.docker/bin:/hostbin
      - ./.docker/data:/data
      - ./.docker/data-private:/data-private
    networks:
      - internal

networks:
  # Internal bridge with no default external exposure.
  internal:
    driver: bridge
