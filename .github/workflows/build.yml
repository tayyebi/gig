name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o gig-linux-${{ matrix.goarch }} .
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: gig-linux-${{ matrix.goarch }}
          path: gig-linux-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
